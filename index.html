<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olimpíada dos Igarapés</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#EAF6D9;--card:#fff;--ink:#17323A;--river:#0E7C86;--water:#CFEFEA;--leaf:#2F9E55;--sun:#FFC83D;--bad:#D6492F;--line:#D3E3B8;--on:#fff;--acai:#5B2A86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C2A22;--card:#16463A;--ink:#F2F6EE;--river:#4FC3C9;--water:#1C5A52;--leaf:#5BD08A;--bad:#FF7A5C;--line:#2B6A5A;--on:#0C2A22;--acai:#C79BFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C2A22;--card:#16463A;--ink:#F2F6EE;--river:#4FC3C9;--water:#1C5A52;--leaf:#5BD08A;--bad:#FF7A5C;--line:#2B6A5A;--on:#0C2A22;--acai:#C79BFF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(circle at 10% 0,rgba(47,158,85,.22),transparent 40%) no-repeat;color:var(--ink);font:18px/1.3 "Baloo 2","Trebuchet MS",system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:10px 16px 32px}#app::before{content:"🌴 🦋 🌿 🐒 🌴";display:block;text-align:center;letter-spacing:.3em;font-size:1.3rem}
button{font:inherit;font-weight:700;color:inherit;cursor:pointer}button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;margin:6px 0 10px}.ph{flex:1;font-weight:800}
.pts{background:var(--sun);color:#17323A;border-radius:99px;padding:2px 12px;font-weight:800}
h1{font-size:2.2rem;line-height:1.05;margin:8px 0 4px;color:var(--leaf);font-weight:800}h2{font-size:1.5rem;margin:6px 0;text-align:center;line-height:1.1}
p{margin:6px 0}.sub{text-align:center}.er{color:var(--bad);font-weight:700;min-height:1.4em}
label{display:block;font-weight:700;margin-top:10px}
input[type=text],input[type=password],input[type=search],input:not([type]){width:100%;min-height:54px;border:3px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;padding:4px 14px;margin-top:4px}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:.95rem}.ck input{width:26px;height:26px;margin-top:2px}
.cta,.ghost{display:block;width:100%;min-height:58px;border:0;border-radius:18px;font-size:1.25rem;margin-top:12px}
.cta{background:var(--leaf);color:#fff}.ghost{background:transparent;border:3px solid var(--line)}
.v3{height:320px;border-radius:28px;background:radial-gradient(circle at 50% 30%,#fff8c9,var(--water) 70%);margin:6px 0;touch-action:pan-y;display:flex;align-items:center;justify-content:center}
.nm{text-align:center;font-weight:800;font-size:1.4rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chip{flex:0 0 auto;min-width:64px;min-height:64px;border:3px solid var(--line);background:var(--card);border-radius:18px;font-size:1.9rem}
.chip.on{border-color:var(--leaf);background:var(--water)}
.lv{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}.lv i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.lh{font-weight:800;margin-top:16px;color:var(--acai)}
.gc{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;border:3px solid var(--line);border-radius:20px;background:var(--card);padding:8px 14px;margin-top:8px;text-align:left}
.gc span:first-child{font-size:2.4rem}.gc small{display:block;font-weight:500}.gc .s{margin-left:auto;font-size:1.3rem}.gc:disabled{opacity:.55}
.tip{text-align:center;font-weight:700;margin:2px 0 6px}.st{text-align:center;font-weight:800;min-height:1.5em}
.riv,.scene{position:relative;height:54vh;min-height:300px;border-radius:24px;overflow:hidden;background:linear-gradient(#58c4cc,#0E7C86)}
.riv{touch-action:none;user-select:none}
.it{position:absolute;left:-70px;width:64px;height:64px;font-size:2.6rem;border:0;background:none;animation:cross linear forwards;padding:0}
@keyframes cross{to{left:100%}}
.boom{animation:boom .3s forwards!important}@keyframes boom{to{transform:scale(1.8);opacity:0}}
.pop{position:absolute;font-weight:800;font-size:1.4rem;color:#fff;text-shadow:0 2px 0 #17323A;animation:up .8s forwards;pointer-events:none}@keyframes up{to{transform:translateY(-50px);opacity:0}}
.under{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;font-size:3rem}
.scene canvas{position:absolute;inset:0;touch-action:none}
.tb{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 10px}.tb i{display:block;height:100%;width:100%;background:var(--sun)}
.opts{display:grid;gap:10px}.opt{display:flex;align-items:center;gap:12px;min-height:72px;border:3px solid var(--line);border-radius:18px;background:var(--card);padding:6px 14px;font-size:1.15rem;text-align:left}
.opt span{font-size:2.4rem}.opt.right{background:var(--leaf);border-color:var(--leaf);color:#fff}.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.gr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hole{aspect-ratio:1;border:0;border-radius:50%;background:#5b3a1e;font-size:2.6rem;box-shadow:inset 0 6px 0 #3d2410;touch-action:manipulation}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mc{aspect-ratio:1;border:0;border-radius:16px;background:var(--leaf);font-size:2.3rem;color:#fff}
.mc.up{background:var(--card);border:3px solid var(--line)}.mc.ok{background:var(--water);border:3px solid var(--leaf)}
.drag{height:150px;display:flex;align-items:center;justify-content:center}.dg{font-size:5rem;touch-action:none;cursor:grab;user-select:none}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bin{min-height:96px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;line-height:1.05;padding:4px}
.stars{text-align:center;font-size:2.6rem}.tot{text-align:center;font-size:1.5rem;font-weight:800}
.stamp{width:200px;height:200px;border-radius:50%;margin:12px auto;background:var(--sun);color:#17323A;border:8px double #17323A;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-6deg);padding:10px;line-height:1.05}
.stamp span{font-size:3.2rem}.stamp b{font-size:1.3rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:var(--card);border:3px solid var(--line);border-radius:16px;text-align:center;padding:6px;font-size:.85rem}.stat b{display:block;font-size:1.6rem}
.row{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;margin-top:8px;display:flex;gap:8px;align-items:center}
.row div{flex:1;min-width:0;overflow-wrap:anywhere}.row small{display:block;font-weight:500}.row button{border:2px solid var(--line);background:none;border-radius:12px;min-height:44px;min-width:44px;padding:0 6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>[...a].sort(()=>Math.random()-.5),rnd=a=>a[Math.floor(Math.random()*a.length)];
const fmt=d=>d.length<3?d:d.length<7?`(${d.slice(0,2)}) ${d.slice(2)}`:d.length<11?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
const lvl=p=>p>=560?['🏅','Guardião da Amazônia']:p>=280?['🌿','Protetor da Mata']:['💧','Curumim do Rio'];
const stars=s=>s>=80?3:s>=50?2:s>0?1:0;
const ecoOf=r=>r.g.reduce((a,x)=>a+Math.floor(x/10),0)-(r.gasto||0);
const norm=r=>{const g=r.g||[],pl=r.pl||[];r.g=Array.from({length:8},(_,i)=>g[i]||0);r.pl=Array.from({length:8},(_,i)=>pl[i]||g[i]>0?1:0);r.gasto=r.gasto||0;return r};

/* ---------- dados ---------- */
const LS='igarapes_v2';let DB=null,P=null,stop=()=>{};
const loadL=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}};
const saveL=a=>{try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){}};
const cur=id=>{try{id?localStorage.setItem('igarapes_cur',id):localStorage.removeItem('igarapes_cur')}catch(e){}};
(async()=>{try{DB=(await window.claude?.use('db'))||null}catch(e){}})();
async function saveRec(r){const a=loadL(),i=a.findIndex(x=>x.id===r.id);i<0?a.push(r):a[i]=r;saveL(a);if(DB)try{await DB.collection('cadastros').doc(r.id).set(r)}catch(e){}}
async function allRecs(){const m=new Map(loadL().map(x=>[x.id,x]));if(DB)try{(await DB.collection('cadastros').get()).docs.forEach(d=>m.set(d.id,d.data()))}catch(e){}return[...m.values()].map(norm)}
async function delRec(id){saveL(loadL().filter(x=>x.id!==id));if(DB)try{await DB.collection('cadastros').doc(id).delete()}catch(e){}}
async function patch(id,fn){const r=(await allRecs()).find(x=>x.id===id);if(r){fn(r);await saveRec(r)}}

/* ---------- animais 3D fofos ---------- */
const S=window.THREE?new THREE.SphereGeometry(1,24,16):0,B=window.THREE?new THREE.BoxGeometry(1,1,1):0;
const m2=(c,x,y,z,a,b,d)=>[[S,c,x,y,z,a,b,d],[S,c,x,y,-z,a,b,d]];
const E=(x,y,z,r=.16)=>[...m2(0x1b1b1b,x,y,z,r*.8,r*1.15,r),...m2(0xffffff,x+r*.5,y+r*.55,z*.9,r*.34,r*.34,r*.34)];
const K=(x,y,z)=>m2(0xff9fb0,x,y,z,.1,.08,.15);
const br=[B,0x7a4f30,0,.25,0,.22,.22,1.8];
const A={
capivara:[[S,0x8b5e3c,-.1,.75,0,1.2,.7,.8],[S,0x9a6b43,1,1.25,0,.9,.8,.8],[S,0xb98a5e,1.75,1.1,0,.38,.3,.42],[S,0x2b1d16,2.1,1.2,0,.12,.1,.14],...E(1.68,1.45,.36,.13),...K(1.55,1.05,.55),...m2(0x7a4f30,.85,2,.45,.17,.17,.12),...m2(0x6b4528,.6,.2,.45,.25,.25,.25),...m2(0x6b4528,-.8,.2,.45,.25,.25,.25)],
onca:[[S,0xe9a53f,-.1,.75,0,1.1,.65,.7],[S,0xf0b24a,1,1.3,0,.9,.8,.8],[S,0xfff0cf,1.75,1.1,0,.4,.3,.45],[S,0xff7f95,2.12,1.2,0,.12,.09,.13],...E(1.68,1.5,.36,.13),...K(1.55,1.1,.58),...m2(0xe9a53f,.85,2.05,.5,.25,.25,.14),...m2(0xff9fb0,.95,2.05,.5,.12,.12,.08),...m2(0x4a2c12,-.3,1.2,.5,.16,.1,.1),...m2(0x4a2c12,.3,1.25,.45,.14,.09,.1),[S,0x4a2c12,-.6,1.4,0,.15,.08,.13],[S,0x4a2c12,1.2,2.05,0,.1,.06,.1],[S,0xe9a53f,-1.3,.9,0,.25,.25,.25],[S,0xe9a53f,-1.6,1.25,0,.25,.25,.25],[S,0x4a2c12,-1.7,1.65,0,.28,.28,.28],...m2(0xf0b24a,.6,.2,.45,.25,.25,.25),...m2(0xf0b24a,-.8,.2,.45,.25,.25,.25)],
arara:[br,[S,0xd7263d,0,1.1,0,.65,.95,.6],[S,0xe0344a,.2,2.3,0,.75,.7,.7],[S,0xfff7e8,.75,2.2,0,.22,.4,.5],...E(.8,2.4,.3,.14),[S,0xf3e9d2,1,2.12,0,.35,.4,.25],[S,0x3b3b3b,.98,1.88,0,.22,.14,.18],...K(.62,2.05,.5),...m2(0x1e63c8,-.1,1.05,.52,.5,.75,.12),...m2(0xf6c91a,.05,1.3,.58,.28,.3,.06),[S,0x1e63c8,-.55,.55,0,.25,.9,.2],[S,0xd7263d,-.75,.6,0,.2,.8,.15],...m2(0xf59e0b,.1,.38,.3,.14,.1,.14)],
tucano:[br,[S,0x1b1b1b,0,1.1,0,.7,.95,.62],[S,0xffffff,.5,1.2,0,.3,.6,.5],[S,0x1b1b1b,.25,2.3,0,.8,.72,.72],[S,0xfff7d6,.7,2,0,.3,.4,.55],...m2(0x4aa3df,.85,2.45,.32,.2,.2,.2),...E(.97,2.45,.33,.11),[S,0xffa31a,1.5,2.25,0,1,.3,.3],[S,0xffd23f,1.5,2.45,0,.9,.1,.26],[S,0x7a1f1f,2.45,2.25,0,.14,.16,.16],...m2(0x2b2b2b,-.1,1.1,.55,.45,.7,.1),[S,0x1b1b1b,-.55,.5,0,.22,.9,.18],...m2(0xf59e0b,.1,.38,.3,.14,.1,.14)],
jacare:[[S,0x5fae4e,0,.6,0,1.15,.5,.7],[S,0xdff0b8,0,.35,0,1,.3,.55],[S,0x6bbd59,1.2,.95,0,.8,.65,.72],[S,0x78c862,1.95,.78,0,.65,.33,.58],...m2(0x2b4a2a,2.5,.92,.2,.07,.07,.07),...m2(0x6bbd59,1.1,1.5,.33,.24,.24,.24),...E(1.3,1.55,.33,.14),...K(1.85,.8,.5),[S,0x5fae4e,-1.2,.5,0,.8,.3,.4],[S,0x5fae4e,-1.9,.42,0,.6,.22,.3],[S,0x5fae4e,-2.4,.4,0,.4,.15,.2],[S,0x3f8a3b,-.5,1.1,0,.16,.14,.16],[S,0x3f8a3b,0,1.12,0,.16,.14,.16],[S,0x3f8a3b,.5,1.08,0,.16,.14,.16],...m2(0x5fae4e,.6,.18,.55,.28,.22,.28),...m2(0x5fae4e,-.6,.18,.55,.28,.22,.28)]};
const ANI={capivara:{n:'Capivara',i:'🦫',s:1.1,dx:-.4,f:'A maior roedora do mundo. Adora o igarapé!'},onca:{n:'Onça-pintada',i:'🐆',s:1,dx:-.15,f:'Forte e esperta, bebe água limpa do rio.'},arara:{n:'Arara-vermelha',i:'🦜',s:1.1,dx:-.3,f:'Colorida e falante, vive nas árvores da margem.'},tucano:{n:'Tucano',i:'🐦',s:.95,dx:-.9,f:'O bico grande pega frutas da floresta.'},jacare:{n:'Jacaré',i:'🐊',s:.78,dx:0,f:'Mora no igarapé e precisa de água limpa.'}};

function view3d(el,key){
 if(!window.THREE){el.innerHTML=`<div style="font-size:5rem">${ANI[key].i}</div>`;return()=>{}}
 const w=el.clientWidth,h=el.clientHeight,r=new THREE.WebGLRenderer({alpha:true,antialias:true});
 r.setSize(w,h);r.setPixelRatio(Math.min(devicePixelRatio,2));el.innerHTML='';el.appendChild(r.domElement);
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,w/h,.1,50);cam.position.set(0,2.6,9);cam.lookAt(0,1.2,0);
 sc.add(new THREE.HemisphereLight(0xffffff,0x88b070,.95));const L=new THREE.DirectionalLight(0xfff2d0,.55);L.position.set(3,6,5);sc.add(L);
 const g=new THREE.Group(),a=ANI[key];
 A[key].forEach(p=>{const m=new THREE.Mesh(p[0],new THREE.MeshLambertMaterial({color:p[1]}));m.position.set(p[2],p[3],p[4]);m.scale.set(p[5],p[6],p[7]);g.add(m)});
 g.scale.setScalar(a.s);g.position.x=a.dx;const pv=new THREE.Group();pv.add(g);sc.add(pv);
 const gr=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,.1,40),new THREE.MeshLambertMaterial({color:0x4fbf6a}));gr.position.y=-.05;sc.add(gr);
 const pad=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.12,32),new THREE.MeshLambertMaterial({color:0xff9fd0}));pad.position.set(-1.8,0,1.3);sc.add(pad);
 let yaw=.6,drag=0,lx=0,mv=0,jump=0,t=0,raf;const cv=r.domElement;cv.style.touchAction='pan-y';
 cv.onpointerdown=e=>{drag=1;lx=e.clientX;mv=0};
 cv.onpointermove=e=>{if(drag){yaw+=(e.clientX-lx)*.012;mv+=Math.abs(e.clientX-lx);lx=e.clientX}};
 cv.onpointerup=cv.onpointerleave=()=>{if(drag&&mv<6)jump=1;drag=0};
 (function loop(){raf=requestAnimationFrame(loop);t+=.016;if(!drag)yaw+=.006;pv.rotation.y=yaw;
  if(jump>0){jump-=.03;const j=Math.sin(Math.max(jump,0)*Math.PI);pv.position.y=j*1.3;pv.scale.set(1-j*.06,1+j*.1,1-j*.06)}else{pv.position.y=0;const b=Math.sin(t*2.2)*.025;pv.scale.set(1-b,1+b*2,1-b)}r.render(sc,cam)})();
 return()=>{cancelAnimationFrame(raf);r.dispose()};
}

/* ---------- telas ---------- */
const hud=t=>`<header><div class="ph">${t}</div><div class="pts" id="hp">⭐ 0</div></header>`;
function home(){
 stop();cur(null);app.innerHTML=`<main><h1>Olimpíada dos Igarapés</h1><p>Cadastre-se e escolha seu bicho guardião da Amazônia.</p>
 <label>Nome completo<input id="nm" autocomplete="name" maxlength="60" placeholder="Maria da Silva"></label>
 <label>Telefone com DDD<input id="tl" inputmode="tel" maxlength="15" placeholder="(92) 91234-5678"></label>
 <label class="ck"><input type="checkbox" id="ok"> Autorizo o uso destes dados somente no circuito educativo.</label>
 <div class="er" id="er"></div><button class="cta" id="go">Continuar</button><button class="ghost" id="adm">Área do ADM</button></main>`;
 $('#tl').oninput=e=>{e.target.value=fmt(e.target.value.replace(/\D/g,'').slice(0,11))};$('#adm').onclick=adm;
 $('#go').onclick=async()=>{
  const nome=$('#nm').value.trim().replace(/\s+/g,' '),d=$('#tl').value.replace(/\D/g,''),er=m=>$('#er').textContent=m;
  if(nome.split(' ').filter(w=>w.length>1).length<2)return er('Escreva nome e sobrenome.');
  if(d.length<10)return er('Digite o telefone com DDD.');
  if(!$('#ok').checked)return er('Marque a autorização para continuar.');
  const ex=(await allRecs()).filter(r=>(r.tel||'').replace(/\D/g,'')===d);
  if(ex.length){const l=ex.find(r=>r.lib);if(!l)return er('Este telefone já foi cadastrado. Peça ao ADM para liberar.');l.lib=0;await saveRec(l)}
  P=norm({id:'p'+d+(ex.length?'_'+Date.now().toString(36):''),nome,tel:fmt(d),animal:'capivara',ts:Date.now()});
  await saveRec(P);cur(P.id);pick();
 };
}
function pick(){
 stop();let k=P.animal;
 app.innerHTML=`<main><h2>Escolha seu guardião</h2><div class="v3" id="v3"></div><div class="nm" id="an"></div><p class="sub" id="af"></p>
 <div class="chips">${Object.keys(ANI).map(x=>`<button class="chip" data-k="${x}" aria-label="${ANI[x].n}">${ANI[x].i}</button>`).join('')}</div>
 <p class="sub">Arraste para girar. Toque no bichinho para ele pular!</p><button class="cta" id="go">Escolher este guardião</button></main>`;
 const show=()=>{stop();stop=view3d($('#v3'),k);$('#an').textContent=ANI[k].n;$('#af').textContent=ANI[k].f;app.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===k))};
 app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{k=c.dataset.k;show()});show();
 $('#go').onclick=()=>{P.animal=k;saveRec(P);hub()};
}
const GM=[['🛶','Pesca de lixo','Toque no lixo do rio',()=>g1()],['🧽','Limpe o igarapé','Passe o dedo na água suja',()=>g2()],['⚡','Quiz relâmpago','Escolha rápido',()=>quiz(2,'Quiz relâmpago',Q1)],
['🌱','Plante a mata','Plante sementes, apague o fogo',()=>g4()],['🧠','Memória da mata','Ache os pares de bichos',()=>g5()],['🦜','Quiz da floresta','Bichos e floresta',()=>quiz(5,'Quiz da floresta',Q2)],
['♻️','Lixeira certa','Arraste para a lixeira certa',()=>g7()],['🏆','Quiz do Guardião','Prova final',()=>quiz(7,'Quiz do Guardião',Q3)]];
const LV=[['Igarapé','🌊',[0,1,2]],['Floresta','🌳',[3,4,5]],['Grande Rio','🛶',[6,7]]];
function hub(){
 stop();const l=lvl(P.pts),done=P.pl.every(x=>x);
 let h=`<main><header><div class="ph">${ANI[P.animal].i} ${esc(P.nome.split(' ')[0])}</div><div class="pts">🪙 ${ecoOf(P)}</div><div class="pts">⭐ ${P.pts||0}</div></header><p class="nm">${l[0]} ${l[1]}</p><div class="lv"><i style="width:${Math.min(100,(P.pts||0)/8)}%"></i></div><p class="sub">Cada jogo só pode ser jogado uma vez.</p>`;
 LV.forEach((v,n)=>{const open=n===0||LV[n-1][2].every(g=>P.pl[g]);h+=`<div class="lh">${v[1]} Nível ${n+1} · ${v[0]} ${open?'':'🔒'}</div>`+v[2].map(i=>{const g=GM[i],dn=P.pl[i];return `<button class="gc" data-i="${i}" ${open&&!dn?'':'disabled'}><span>${g[0]}</span><span>${g[1]}<small>${g[2]}</small></span><span class="s">${dn?('⭐'.repeat(stars(P.g[i]))||'💧'):open?'':'🔒'}</span></button>`}).join('')});
 app.innerHTML=h+`${done?'<button class="cta" id="fin">🏅 Ver minha conquista</button>':''}<button class="ghost" id="nw">Próximo participante</button></main>`;
 app.querySelectorAll('.gc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;P.pl[i]=1;saveRec(P);GM[i][3]()});
 if(done)$('#fin').onclick=fim;$('#nw').onclick=home;
}
function result(i,sc){
 P.g[i]=sc;P.pts=P.g.reduce((a,b)=>a+b,0);P.ts=Date.now();saveRec(P);
 app.innerHTML=`<main><h2>${sc>=50?'Muito bem!':'Boa tentativa!'}</h2><div class="stars">${'⭐'.repeat(stars(sc))||'💧'}</div><p class="tot">${sc} pontos</p><p class="sub">🪙 +${Math.floor(sc/10)} ecomoedas${sc>=100?' (pontuação máxima!)':''}</p><button class="cta" id="b">Voltar ao painel</button></main>`;$('#b').onclick=hub;
}
function fim(){
 const l=lvl(P.pts);app.innerHTML=`<main><h2>Parabéns, ${esc(P.nome.split(' ')[0])}!</h2><div class="stamp"><span>${l[0]}</span><b>${l[1]}</b><small>com ${ANI[P.animal].n}</small></div><p class="tot">⭐ ${P.pts} · 🪙 ${ecoOf(P)}</p><p class="sub">Mostre esta tela ao ADM para trocar suas ecomoedas.</p><button class="cta" id="a">Voltar ao painel</button></main>`;$('#a').onclick=hub;

function g1(){
 let t=25,sc=0,cb=0;app.innerHTML=hud('Pesca de lixo')+`<div class="tip">Toque no lixo. Cuidado com os bichos!</div><div class="riv" id="rv"></div><div class="st" id="st"></div>`;
 const rv=$('#rv'),T=['🥤','🛍️','🔋','🛢️','🍾','🥫'],F=['🐟','🐢','🐠'];
 const upd=()=>{$('#hp').textContent='⭐ '+Math.min(100,Math.round(sc/2));$('#st').textContent=`⏱️ ${t}s  ${cb>=4?'🔥':''} combo ${cb}`};
 function pop(e,x){const b=e.getBoundingClientRect(),r=rv.getBoundingClientRect(),s=document.createElement('div');s.className='pop';s.textContent=x;s.style.left=b.left-r.left+'px';s.style.top=b.top-r.top+'px';rv.appendChild(s);setTimeout(()=>s.remove(),800)}
 function spawn(){const bad=Math.random()<.25,e=document.createElement('button');e.className='it';e.textContent=rnd(bad?F:T);e.style.top=5+Math.random()*80+'%';e.style.animationDuration=3+Math.random()*2.2+'s';
  e.onpointerdown=ev=>{ev.preventDefault();if(e.dead)return;e.dead=1;if(bad){cb=0;sc=Math.max(0,sc-10);pop(e,'-10')}else{cb++;const g=10*(1+Math.floor(cb/4));sc+=g;pop(e,'+'+g)}e.classList.add('boom');upd()};
  e.onanimationend=()=>{if(!bad&&!e.dead){cb=0;upd()}e.remove()};rv.appendChild(e)}
 upd();const sp=setInterval(spawn,620),tm=setInterval(()=>{t--;upd();if(t<=0){clearInterval(sp);clearInterval(tm);result(0,Math.min(100,Math.round(sc/2)))}},1000);
 stop=()=>{clearInterval(sp);clearInterval(tm)};
}
function g2(){
 app.innerHTML=hud('Limpe o igarapé')+`<div class="tip">Passe o dedo para limpar a água!</div><div class="scene" id="sc"><div class="under">🐟 🐢 🐠 🐸 🐟 🌿</div><canvas id="cv"></canvas></div><div class="st" id="st"></div>`;
 const sc=$('#sc'),cv=$('#cv'),W=cv.width=sc.clientWidth,H=cv.height=sc.clientHeight,x=cv.getContext('2d',{willReadFrequently:true});
 x.fillStyle='#6b5a3a';x.fillRect(0,0,W,H);
 for(let i=0;i<60;i++){x.fillStyle=`rgba(${70+Math.random()*50|0},${55+Math.random()*30|0},30,.5)`;x.beginPath();x.arc(Math.random()*W,Math.random()*H,10+Math.random()*30,0,7);x.fill()}
 x.font='34px serif';for(let i=0;i<14;i++)x.fillText(rnd(['🥤','🛍️','🔋','🍾','🥫']),Math.random()*(W-40),30+Math.random()*(H-40));
 let down=0,t=30;
 const wipe=e=>{const r=cv.getBoundingClientRect();x.globalCompositeOperation='destination-out';x.beginPath();x.arc(e.clientX-r.left,e.clientY-r.top,30,0,7);x.fill()};
 cv.onpointerdown=e=>{down=1;wipe(e)};cv.onpointermove=e=>down&&wipe(e);cv.onpointerup=cv.onpointerleave=()=>down=0;
 const pct=()=>{const d=x.getImageData(0,0,W,H).data;let c=0,n=0;for(let i=3;i<d.length;i+=64){n++;if(d[i]<40)c++}return Math.round(c/n*100)};
 const tm=setInterval(()=>{t-=.5;const p=pct();$('#hp').textContent='⭐ '+p;$('#st').textContent=`⏱️ ${Math.ceil(t)}s  água limpa ${p}%`;
  if(p>=90||t<=0){clearInterval(tm);result(1,p>=90?Math.min(100,90+Math.ceil(t/3)):p)}},500);
 stop=()=>clearInterval(tm);
}

function quiz(n,title,pool){
 const list=shuf(pool).slice(0,6);let i=0,sc=0,cb=0;
 const go=()=>{
  if(i>=list.length)return result(n,Math.min(100,Math.round(sc*100/96)));
  const q=list[i++],o=shuf(q[1].map((x,k)=>({x,k}))),ok=o.findIndex(y=>y.k===q[2]);let over=0;
  app.innerHTML=hud(`${title} ${i}/${list.length}`)+`<div class="tb"><i id="tb"></i></div><h2>${q[0]}</h2><div class="opts">${o.map((y,k)=>`<button class="opt" data-k="${k}"><span>${y.x[0]}</span>${y.x[1]}</button>`).join('')}</div><div class="st" id="st">${cb>1?'🔥 '+cb+' seguidas!':''}</div>`;
  $('#hp').textContent='⭐ '+Math.round(sc*100/96);const bar=$('#tb'),t0=Date.now();bar.style.transition='width 8s linear';requestAnimationFrame(()=>bar.style.width='0%');
  const fin=k=>{if(over)return;over=1;clearTimeout(to);const left=Math.max(0,8-(Date.now()-t0)/1000);
   if(k===ok){cb++;sc+=10+Math.round(left/8*6)}else cb=0;
   app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=1;if(j===ok)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
   $('#hp').textContent='⭐ '+Math.round(sc*100/96);setTimeout(go,1100)};
  const to=setTimeout(()=>fin(-1),8000);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>fin(+b.dataset.k));
  stop=()=>{over=1;clearTimeout(to)};
 };go();
}
function g4(){

 const hs=[...app.querySelectorAll('.hole')],st={};
 const upd=()=>{$('#hp').textContent='⭐ '+Math.min(100,Math.round(sc/2.2));$('#st').textContent=`⏱️ ${t}s`};

async function panel(q){
 const all=(await allRecs()).sort((a,b)=>(b.pts||0)-(a.pts||0)),qq=q.toLowerCase(),a=all.filter(r=>(r.nome+r.tel).toLowerCase().includes(qq)),avg=all.length?Math.round(all.reduce((s,r)=>s+(r.pts||0),0)/all.length):0,eco=all.reduce((s,r)=>s+ecoOf(r),0);

 <p class="sub">${DB?'Dados compartilhados entre aparelhos':'Dados salvos só neste aparelho'}</p>
 <input type="search" id="q" placeholder="Buscar por nome ou telefone" value="${esc(q)}">
 ${a.map((r,i)=>{const an=ANI[r.animal]||ANI.capivara;return `<div class="row"><span>${i<3&&!q?['🥇','🥈','🥉'][i]:an.i}</span><div><b>${esc(r.nome)}</b><small>${esc(r.tel)} · ⭐ ${r.pts||0} · 🪙 ${ecoOf(r)}${r.lib?' · 🔓 liberado':''}</small></div><button data-l="${esc(r.id)}" aria-label="Liberar novo cadastro" title="Liberar novo cadastro com este telefone">🔓</button><button data-c="${esc(r.id)}" aria-label="Resgatar ecomoedas">🪙</button><button data-d="${esc(r.id)}" aria-label="Apagar">🗑️</button></div>`}).join('')||'<p class="sub">Nenhum cadastro ainda.</p>'}
 <p class="sub">🔓 libera 1 novo cadastro com o mesmo telefone · 🪙 resgata (zera) as ecomoedas</p>
 <button class="cta" id="csv">Baixar CSV</button><button class="ghost" id="all">Apagar todos</button><button class="ghost" id="ex">Sair</button><div class="er" id="er"></div></main>`;
 let tq;$('#q').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>panel(e.target.value),350)};
 const arm=(b,fn)=>{let on=0;b.onclick=()=>{if(on)return fn();on=1;const o=b.textContent;b.textContent='❓';setTimeout(()=>{on=0;b.textContent=o},3000)}};

 $('#csv').onclick=async()=>{
  const c=v=>`"${String(v??'').replace(/"/g,'""')}"`,rows=[['Nome','Telefone','Animal','Pontos','Ecomoedas','J1','J2','J3','J4','J5','J6','J7','J8','Data'],...all.map(r=>[r.nome,r.tel,ANI[r.animal]?.n,r.pts,ecoOf(r),...r.g,new Date(r.ts||0).toLocaleString('pt-BR')])].map(r=>r.map(c).join(',')).join('\n');
  try{const d=await window.claude?.use('downloads');if(!d)throw 0;await d.save({filename:'cadastros-igarapes.csv',data:'\ufeff'+rows})}catch(e){$('#er').textContent='Download indisponível neste aparelho.'}
 };
}
