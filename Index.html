<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olimpíada dos Igarapés</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#EAF6D9;--card:#fff;--ink:#17323A;--river:#0E7C86;--water:#CFEFEA;--leaf:#2F9E55;--sun:#FFC83D;--bad:#D6492F;--line:#D3E3B8;--on:#fff;--acai:#5B2A86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C2A22;--card:#16463A;--ink:#F2F6EE;--river:#4FC3C9;--water:#1C5A52;--leaf:#5BD08A;--bad:#FF7A5C;--line:#2B6A5A;--on:#0C2A22;--acai:#C79BFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C2A22;--card:#16463A;--ink:#F2F6EE;--river:#4FC3C9;--water:#1C5A52;--leaf:#5BD08A;--bad:#FF7A5C;--line:#2B6A5A;--on:#0C2A22;--acai:#C79BFF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(circle at 10% 0,rgba(47,158,85,.22),transparent 40%) no-repeat;color:var(--ink);font:18px/1.3 "Baloo 2","Trebuchet MS",system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:10px 16px 32px}#app::before{content:"🌴 🦋 🌿 🐒 🌴";display:block;text-align:center;letter-spacing:.3em;font-size:1.3rem}
button{font:inherit;font-weight:700;color:inherit;cursor:pointer}button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;margin:6px 0 10px}.ph{flex:1;font-weight:800}
.pts{background:var(--sun);color:#17323A;border-radius:99px;padding:2px 12px;font-weight:800}
h1{font-size:2.2rem;line-height:1.05;margin:8px 0 4px;color:var(--leaf);font-weight:800}h2{font-size:1.5rem;margin:6px 0;text-align:center;line-height:1.1}
p{margin:6px 0}.sub{text-align:center}.er{color:var(--bad);font-weight:700;min-height:1.4em}
label{display:block;font-weight:700;margin-top:10px}
input[type=text],input[type=password],input[type=search],input:not([type]){width:100%;min-height:54px;border:3px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;padding:4px 14px;margin-top:4px}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:.95rem}.ck input{width:26px;height:26px;margin-top:2px}
.cta,.ghost{display:block;width:100%;min-height:58px;border:0;border-radius:18px;font-size:1.25rem;margin-top:12px}
.cta{background:var(--leaf);color:#fff}.ghost{background:transparent;border:3px solid var(--line)}
.v3{height:320px;border-radius:28px;background:radial-gradient(circle at 50% 30%,#fff8c9,var(--water) 70%);margin:6px 0;touch-action:pan-y;display:flex;align-items:center;justify-content:center}
.nm{text-align:center;font-weight:800;font-size:1.4rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chip{flex:0 0 auto;min-width:64px;min-height:64px;border:3px solid var(--line);background:var(--card);border-radius:18px;font-size:1.9rem}
.chip.on{border-color:var(--leaf);background:var(--water)}
.lv{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}.lv i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.lh{font-weight:800;margin-top:16px;color:var(--acai)}
.gc{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;border:3px solid var(--line);border-radius:20px;background:var(--card);padding:8px 14px;margin-top:8px;text-align:left}
.gc span:first-child{font-size:2.4rem}.gc small{display:block;font-weight:500}.gc .s{margin-left:auto;font-size:1.3rem}.gc:disabled{opacity:.55}
.tip{text-align:center;font-weight:700;margin:2px 0 6px}.st{text-align:center;font-weight:800;min-height:1.5em}
.riv,.scene{position:relative;height:54vh;min-height:300px;border-radius:24px;overflow:hidden;background:linear-gradient(#58c4cc,#0E7C86)}
.riv{touch-action:none;user-select:none}
.it{position:absolute;left:-70px;width:64px;height:64px;font-size:2.6rem;border:0;background:none;animation:cross linear forwards;padding:0}
@keyframes cross{to{left:100%}}
.boom{animation:boom .3s forwards!important}@keyframes boom{to{transform:scale(1.8);opacity:0}}
.pop{position:absolute;font-weight:800;font-size:1.4rem;color:#fff;text-shadow:0 2px 0 #17323A;animation:up .8s forwards;pointer-events:none}@keyframes up{to{transform:translateY(-50px);opacity:0}}
.under{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;font-size:3rem}
.scene canvas{position:absolute;inset:0;touch-action:none}
.tb{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 10px}.tb i{display:block;height:100%;width:100%;background:var(--sun)}
.opts{display:grid;gap:10px}.opt{display:flex;align-items:center;gap:12px;min-height:72px;border:3px solid var(--line);border-radius:18px;background:var(--card);padding:6px 14px;font-size:1.15rem;text-align:left}
.opt span{font-size:2.4rem}.opt.right{background:var(--leaf);border-color:var(--leaf);color:#fff}.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.gr3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hole{aspect-ratio:1;border:0;border-radius:50%;background:#5b3a1e;font-size:2.6rem;box-shadow:inset 0 6px 0 #3d2410;touch-action:manipulation}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mc{aspect-ratio:1;border:0;border-radius:16px;background:var(--leaf);font-size:2.3rem;color:#fff}
.mc.up{background:var(--card);border:3px solid var(--line)}.mc.ok{background:var(--water);border:3px solid var(--leaf)}
.drag{height:150px;display:flex;align-items:center;justify-content:center}.dg{font-size:5rem;touch-action:none;cursor:grab;user-select:none}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bin{min-height:96px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;line-height:1.05;padding:4px}
.stars{text-align:center;font-size:2.6rem}.tot{text-align:center;font-size:1.5rem;font-weight:800}
.stamp{width:200px;height:200px;border-radius:50%;margin:12px auto;background:var(--sun);color:#17323A;border:8px double #17323A;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-6deg);padding:10px;line-height:1.05}
.stamp span{font-size:3.2rem}.stamp b{font-size:1.3rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:var(--card);border:3px solid var(--line);border-radius:16px;text-align:center;padding:6px;font-size:.85rem}.stat b{display:block;font-size:1.6rem}
.row{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;margin-top:8px;display:flex;gap:8px;align-items:center}
.row div{flex:1;min-width:0;overflow-wrap:anywhere}.row small{display:block;font-weight:500}.row button{border:2px solid var(--line);background:none;border-radius:12px;min-height:44px;min-width:44px;padding:0 6px}
.cfg{margin:10px 0;padding:10px 12px;border:3px solid var(--line);border-radius:16px;background:var(--card)}.cfg b{display:block;margin-top:6px}.two{display:flex;gap:8px}.two button{flex:1;min-height:50px;margin-top:8px;font-size:1rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>[...a].sort(()=>Math.random()-.5),rnd=a=>a[Math.floor(Math.random()*a.length)];
const fmt=d=>d.length<3?d:d.length<7?`(${d.slice(0,2)}) ${d.slice(2)}`:d.length<11?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
const lvl=p=>p>=560?['🏅','Guardião da Amazônia']:p>=280?['🌿','Protetor da Mata']:['💧','Curumim do Rio'];
const stars=s=>s>=80?3:s>=50?2:s>0?1:0;
const ecoOf=r=>r.g.reduce((a,x)=>a+Math.floor(x/10),0)-(r.gasto||0);
const norm=r=>{const g=r.g||[],pl=r.pl||[];r.g=Array.from({length:8},(_,i)=>g[i]||0);r.pl=Array.from({length:8},(_,i)=>pl[i]||g[i]>0?1:0);r.gasto=r.gasto||0;return r};

/* ---------- dados (neste aparelho) + envio de e-mail ---------- */
const LS='igarapes_v2',CF='igarapes_cfg',FQ='igarapes_fila';let P=null,stop=()=>{};
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'')||d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const loadL=()=>jget(LS,[]),saveL=a=>jset(LS,a),loadC=()=>jget(CF,{}),saveC=c=>jset(CF,c);
const cur=id=>{try{id?localStorage.setItem('igarapes_cur',id):localStorage.removeItem('igarapes_cur')}catch(e){}};
async function saveRec(r){const a=loadL(),i=a.findIndex(x=>x.id===r.id);i<0?a.push(r):a[i]=r;saveL(a)}
async function allRecs(){return loadL().map(norm)}
async function delRec(id){saveL(loadL().filter(x=>x.id!==id))}
async function patch(id,fn){const a=loadL(),i=a.findIndex(x=>x.id===id);if(i<0)return;const r=norm(a[i]);fn(r);a[i]=r;saveL(a)}
/* e-mail: FormSubmit (formsubmit.co) entrega cada envio na caixa do e-mail cadastrado no ADM */
async function sendMail(body,test){
 const c=loadC();if(!c.email)return'Cadastre um e-mail na Área do ADM.';
 try{const r=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(c.email),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(Object.assign({_template:'table',_captcha:'false'},body))});
  const j=await r.json();if(String(j.success)==='true')return'Enviado. No primeiro envio, abra o e-mail de confirmação do FormSubmit e clique em ativar.';
  throw new Error(j.message||'falha')}
 catch(e){if(!test)jset(FQ,[...jget(FQ,[]),body]);return test?'Não foi possível enviar agora. Confira a internet e o e-mail.':'Sem envio agora; guardado para tentar de novo.'}
}
async function flush(){const q=jget(FQ,[]);if(!q.length)return;jset(FQ,[]);for(const b of q)await sendMail(b)}
function mail(extra){if(!P)return;const nd=(P.rs||[]).filter(Boolean).length;
 const b=Object.assign({_subject:'Olimpíada dos Igarapés: '+P.nome+' ('+(extra.Jogo||'')+')',Participante:P.nome,Telefone:P.tel,'Animal guardião':(ANI[P.animal]||{}).n,'Total de pontos':P.pts,'Ecomoedas (saldo)':ecoOf(P),'Jogos concluídos':nd+' de 8',Data:new Date().toLocaleString('pt-BR')},extra);
 flush().then(()=>sendMail(b))}

/* ---------- animais 3D (modelos procedurais com texturas) ---------- */
const T=window.THREE,rn=(a,b)=>a+Math.random()*(b-a);
const SPH=T&&new T.SphereGeometry(1,32,24),CONE=T&&new T.ConeGeometry(1,1,12),cyl=(a,b,h)=>new T.CylinderGeometry(a,b,h,14);
function tex(w,draw,rep){const c=document.createElement('canvas');c.width=c.height=w;draw(c.getContext('2d'),w);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);return t}
const strokes=(x,w,n,cols)=>{for(let i=0;i<n;i++){x.strokeStyle=cols[i%cols.length];x.globalAlpha=rn(.12,.35);x.lineWidth=rn(1,2.2);const a=rn(0,w),b=rn(0,w);x.beginPath();x.moveTo(a,b);x.lineTo(a+rn(-3,3),b+rn(5,12));x.stroke()}x.globalAlpha=1};
const furTex=(base,d,l)=>tex(256,(x,w)=>{x.fillStyle=base;x.fillRect(0,0,w,w);strokes(x,w,3200,[d,l])},[2,2]);
const jagTex=()=>tex(512,(x,w)=>{x.fillStyle='#d6a03e';x.fillRect(0,0,w,w);strokes(x,w,3000,['#b9812a','#efc872']);
 for(let i=0;i<48;i++){const cx=rn(0,w),cy=rn(0,w),r=rn(15,26);x.fillStyle='rgba(168,112,38,.75)';x.beginPath();x.arc(cx,cy,r*.8,0,7);x.fill();x.fillStyle='#2a190b';for(let k=0;k<7;k++){const a=k/7*6.283+rn(-.2,.2);x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,rn(5,8),0,7);x.fill()}}
 for(let i=0;i<60;i++){x.fillStyle='#2a190b';x.beginPath();x.arc(rn(0,w),rn(0,w),rn(2,4),0,7);x.fill()}},[2,1]);
const scaleTex=()=>tex(256,(x,w)=>{x.fillStyle='#55663a';x.fillRect(0,0,w,w);for(let r=0;r<16;r++)for(let c=0;c<16;c++){x.fillStyle=`rgb(${70+rn(0,25)|0},${88+rn(0,25)|0},${50+rn(0,15)|0})`;x.strokeStyle='#33401f';x.lineWidth=2;x.beginPath();x.ellipse(c*16+(r%2)*8+8,r*16+8,7,7,0,0,7);x.fill();x.stroke()}},[3,2]);
const mat=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.9,metalness:0},o||{}));
function add(g,geo,m,p,s,r){const x=new T.Mesh(geo,m);x.position.set(p[0],p[1],p[2]);if(s)x.scale.set(s[0],s[1],s[2]);if(r)x.rotation.set(r[0],r[1],r[2]);g.add(x);return x}
const both=(g,geo,m,p,s,r)=>{add(g,geo,m,p,s,r);add(g,geo,m,[p[0],p[1],-p[2]],s,r&&[r[0],-r[1],-r[2]])};
const eyes=(g,x,y,z,r,iris)=>[1,-1].forEach(k=>{add(g,SPH,mat(iris||0x15110d,{roughness:.2}),[x,y,z*k],[r,r,r]);add(g,SPH,mat(0x000000,{roughness:.1}),[x+r*.35,y,z*k],[r*.7,r*.7,r*.7]);add(g,SPH,mat(0xffffff,{emissive:0xffffff}),[x+r*.55,y+r*.45,z*k*.93],[r*.25,r*.25,r*.25])});
const tube=(pts,r,m)=>new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts.map(p=>new T.Vector3(p[0],p[1],p[2]))),24,r,10),m);
const perch=(g,y)=>{add(g,cyl(.12,.12,2.4),mat(0x6b4a2e),[0,y,0],null,[Math.PI/2,0,0]);add(g,cyl(.14,.18,y),mat(0x6b4a2e),[0,y/2,0])};
const A={
capivara(){const g=new T.Group(),t1=furTex('#8a6a47','#5e4429','#b58f60'),t2=furTex('#9c7a50','#6b4f31','#c09a6a'),f=mat(0x8a6a47,{map:t1}),sk=mat(0x9c7a50,{map:t2}),d=mat(0x4a3724);
 add(g,SPH,f,[0,1,0],[1.55,.82,.78]);add(g,SPH,f,[-.8,.98,0],[.95,.8,.8]);add(g,SPH,f,[1.15,1.12,0],[.72,.72,.64]);
 add(g,SPH,f,[1.75,1.2,0],[.62,.55,.5]);add(g,SPH,sk,[2.2,1.1,0],[.52,.46,.46]);add(g,SPH,d,[2.68,1.17,0],[.16,.12,.26]);
 eyes(g,1.98,1.38,.4,.075);both(g,SPH,d,[1.55,1.78,.3],[.13,.15,.08]);
 both(g,cyl(.15,.11,.75),f,[1,.38,.42]);both(g,cyl(.2,.13,.8),f,[-.95,.4,.48]);
 both(g,SPH,d,[1.04,.06,.44],[.2,.09,.16]);both(g,SPH,d,[-.9,.06,.5],[.22,.09,.18]);return g},
onca(){const g=new T.Group(),jt=jagTex(),j=()=>mat(0xd6a03e,{map:jt}),cr=mat(0xf1dcb0),dk=mat(0x2a190b);
 add(g,SPH,j(),[0,1.45,0],[1.5,.7,.58]);add(g,SPH,j(),[1,1.5,0],[.8,.75,.6]);add(g,SPH,j(),[-1,1.45,0],[.85,.72,.6]);
 add(g,SPH,j(),[1.6,1.8,0],[.6,.55,.5]);add(g,SPH,j(),[2.05,1.9,0],[.6,.52,.52]);add(g,SPH,cr,[2.5,1.75,0],[.34,.26,.34]);add(g,SPH,mat(0x3a2020),[2.82,1.82,0],[.1,.08,.14]);
 eyes(g,2.3,2,.28,.085,0xe3b23c);both(g,SPH,j(),[1.9,2.38,.36],[.17,.2,.08]);both(g,SPH,dk,[1.93,2.36,.36],[.1,.13,.05]);
 both(g,cyl(.2,.15,1.25),j(),[1.2,.63,.38]);both(g,cyl(.24,.16,1.25),j(),[-1.1,.63,.4]);
 both(g,SPH,cr,[1.28,.12,.4],[.3,.16,.22]);both(g,SPH,cr,[-1.02,.12,.42],[.32,.16,.24]);
 const tl=[[-1.7,1.6,0],[-2.4,1.5,.15],[-3,1.1,.2],[-3.3,.6,.1]];g.add(tube(tl,.14,j()));add(g,SPH,dk,tl[3],[.15,.15,.15]);return g},
arara(){const g=new T.Group(),red=mat(0xc8102e),blue=mat(0x1c4fb8),yel=mat(0xf2c314),w=mat(0xf4ead8);
 perch(g,1.15);
 add(g,SPH,red,[0,2.3,0],[.6,1,.55],[0,0,-.18]);add(g,SPH,red,[.32,3.35,0],[.42,.42,.4]);
 both(g,SPH,w,[.62,3.3,.2],[.2,.3,.22]);eyes(g,.66,3.42,.3,.07,0xf2e4a0);
 add(g,SPH,mat(0xf1e6d0,{roughness:.5}),[.9,3.2,0],[.38,.34,.22],[0,0,-.3]);add(g,SPH,mat(0x3a3a3a),[.78,2.98,0],[.22,.13,.17]);
 both(g,SPH,red,[-.1,2.35,.5],[.42,.95,.12],[0,0,-.18]);both(g,SPH,yel,[0,2.85,.55],[.3,.22,.08],[0,0,-.18]);both(g,SPH,blue,[-.22,1.85,.57],[.3,.7,.1],[0,0,-.18]);
 add(g,SPH,red,[-.5,1,0],[.16,1.1,.1],[0,0,.22]);both(g,SPH,blue,[-.62,.55,.12],[.12,.9,.06],[0,0,.22]);
 both(g,SPH,mat(0x777777),[0,1.17,.3],[.14,.08,.12]);return g},
tucano(){const g=new T.Group(),bk=mat(0x15151a),wh=mat(0xf6f0dc),or=mat(0xf58a1f,{roughness:.5});
 perch(g,1.15);
 add(g,SPH,bk,[0,2.3,0],[.55,.95,.5],[0,0,-.15]);add(g,SPH,wh,[.38,2.75,0],[.3,.5,.45],[0,0,-.15]);add(g,SPH,bk,[.5,3.3,0],[.45,.45,.42]);
 add(g,SPH,wh,[.7,3.05,0],[.25,.3,.4]);
 add(g,SPH,or,[1.6,3.2,0],[1.15,.3,.26],[0,0,-.08]);add(g,SPH,mat(0xffd23f,{roughness:.5}),[1.55,3.4,0],[1.05,.1,.24],[0,0,-.08]);add(g,SPH,bk,[2.7,3.12,0],[.12,.16,.14]);
 both(g,SPH,mat(0x2f88d4),[.78,3.38,.3],[.15,.15,.1]);eyes(g,.86,3.4,.31,.05);
 both(g,SPH,mat(0x2b2b30),[-.1,2.3,.46],[.4,.8,.1],[0,0,-.15]);
 add(g,SPH,bk,[-.5,1,0],[.2,1.1,.12],[0,0,.22]);add(g,SPH,mat(0xd7263d),[-.2,1.55,0],[.18,.2,.4]);
 both(g,SPH,mat(0x777777),[0,1.17,.3],[.14,.08,.12]);return g},
jacare(){const g=new T.Group(),st=scaleTex(),sc=()=>mat(0x55663a,{map:st}),bel=mat(0xd6d3a0),dk=mat(0x3d4a28);
 add(g,SPH,sc(),[0,.55,0],[1.7,.45,.72]);add(g,SPH,bel,[0,.3,0],[1.5,.22,.6]);
 add(g,SPH,sc(),[1.75,.62,0],[.62,.38,.56]);add(g,SPH,sc(),[2.55,.5,0],[.95,.22,.42]);add(g,SPH,mat(0xcfd09a),[2.5,.36,0],[.9,.1,.38]);
 both(g,SPH,dk,[3.45,.6,.1],[.07,.06,.07]);both(g,SPH,sc(),[2,.98,.28],[.17,.17,.15]);both(g,SPH,mat(0xd9b63a,{roughness:.3}),[2.05,1.02,.36],[.06,.07,.05]);

   const ok=+b.dataset.b===it[1];if(ok)sc++;b.style.outline=`6px solid ${ok?'#2F9E55':'#FFC83D'}`;$('#st').textContent=ok?'Isso mesmo! ✅':'Ops! Era outra lixeira.';d.onpointerdown=null;setTimeout(go,900)};
 };go();stop=()=>{};
}

/* ---------- ADM ---------- */
function adm(){
 stop();app.innerHTML=`<main><h2>Área do ADM</h2><p class="sub">Digite o PIN para ver os cadastros.</p><input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="PIN"><div class="er" id="er"></div><button class="cta" id="go">Entrar</button><button class="ghost" id="bk">Voltar</button></main>`;
 $('#bk').onclick=home;$('#go').onclick=()=>$('#pin').value===(loadC().pin||'2026')?panel(''):$('#er').textContent='PIN incorreto.';
}
async function panel(q){
 const all=(await allRecs()).sort((a,b)=>(b.pts||0)-(a.pts||0)),qq=q.toLowerCase(),a=all.filter(r=>(r.nome+r.tel).toLowerCase().includes(qq)),avg=all.length?Math.round(all.reduce((s,r)=>s+(r.pts||0),0)/all.length):0,eco=all.reduce((s,r)=>s+ecoOf(r),0);
 app.innerHTML=`<main><h2>Cadastros</h2><div class="stats"><div class="stat"><b>${all.length}</b>participantes</div><div class="stat"><b>${avg}</b>média de pontos</div><div class="stat"><b>🪙 ${eco}</b>ecomoedas com saldo</div></div>
 <div class="cfg"><b>E-mail que recebe os resultados</b><input id="em" inputmode="email" autocomplete="off" placeholder="seuemail@gmail.com" value="${esc(loadC().email||'')}"><div class="two"><button class="ghost" id="svm">Salvar e-mail</button><button class="ghost" id="tst">Enviar teste</button></div><div class="sub" id="ms">${loadC().email?'Cada partida finalizada envia um e-mail.':'Sem e-mail cadastrado: nada é enviado.'}</div>
 <b>Trocar PIN</b><input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="Novo PIN (4 a 8 números)"><button class="ghost" id="svp">Salvar PIN</button></div>
 <p class="sub">Dados salvos neste aparelho. Baixe o CSV para guardar uma cópia.</p>
 <input type="search" id="q" placeholder="Buscar por nome ou telefone" value="${esc(q)}">
 ${a.map((r,i)=>{const an=ANI[r.animal]||ANI.capivara;return `<div class="row"><span>${i<3&&!q?['🥇','🥈','🥉'][i]:an.i}</span><div><b>${esc(r.nome)}</b><small>${esc(r.tel)} · ⭐ ${r.pts||0} · 🪙 ${ecoOf(r)}${r.lib?' · 🔓 liberado':''}</small></div><button data-l="${esc(r.id)}" aria-label="Liberar novo cadastro" title="Liberar novo cadastro com este telefone">🔓</button><button data-c="${esc(r.id)}" aria-label="Resgatar ecomoedas">🪙</button><button data-d="${esc(r.id)}" aria-label="Apagar">🗑️</button></div>`}).join('')||'<p class="sub">Nenhum cadastro ainda.</p>'}
 <p class="sub">🔓 libera 1 novo cadastro com o mesmo telefone · 🪙 resgata (zera) as ecomoedas</p>
 <button class="cta" id="csv">Baixar CSV</button><button class="ghost" id="all">Apagar todos</button><button class="ghost" id="ex">Sair</button><div class="er" id="er"></div></main>`;
 let tq;$('#q').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>panel(e.target.value),350)};
 const arm=(b,fn)=>{let on=0;b.onclick=()=>{if(on)return fn();on=1;const o=b.textContent;b.textContent='❓';setTimeout(()=>{on=0;b.textContent=o},3000)}};
 app.querySelectorAll('[data-d]').forEach(b=>arm(b,async()=>{await delRec(b.dataset.d);panel(q)}));
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=async()=>{await patch(b.dataset.l,r=>r.lib=1);panel(q)});
 app.querySelectorAll('[data-c]').forEach(b=>arm(b,async()=>{await patch(b.dataset.c,r=>r.gasto=r.g.reduce((s,x)=>s+Math.floor(x/10),0));panel(q)}));
 arm($('#all'),async()=>{for(const r of all)await delRec(r.id);panel('')});$('#ex').onclick=home;
 flush();
 $('#svm').onclick=()=>{const v=$('#em').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return $('#ms').textContent='E-mail inválido.';const c=loadC();c.email=v;saveC(c);$('#ms').textContent='E-mail salvo. Toque em "Enviar teste" para ativar.'};
 $('#tst').onclick=async()=>{if(!loadC().email)return $('#ms').textContent='Salve um e-mail primeiro.';$('#ms').textContent='Enviando…';$('#ms').textContent=await sendMail({_subject:'Teste: Olimpíada dos Igarapés',Mensagem:'Teste de envio.'},true)};
 $('#svp').onclick=()=>{const v=$('#np').value;if(!/^\d{4,8}$/.test(v))return $('#ms').textContent='O PIN deve ter de 4 a 8 números.';const c=loadC();c.pin=v;saveC(c);$('#np').value='';$('#ms').textContent='PIN alterado.'};
 $('#csv').onclick=async()=>{
  const c=v=>`"${String(v??'').replace(/"/g,'""')}"`,rows=[['Nome','Telefone','Animal','Pontos','Ecomoedas','J1','J2','J3','J4','J5','J6','J7','J8','Data'],...all.map(r=>[r.nome,r.tel,ANI[r.animal]?.n,r.pts,ecoOf(r),...r.g,new Date(r.ts||0).toLocaleString('pt-BR')])].map(r=>r.map(c).join(',')).join('\n');
  const u=URL.createObjectURL(new Blob(['\ufeff'+rows],{type:'text/csv;charset=utf-8'})),k=document.createElement('a');k.href=u;k.download='cadastros-igarapes.csv';document.body.appendChild(k);k.click();k.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
 };
}
(function boot(){try{const r=loadL().find(x=>x.id===localStorage.getItem('igarapes_cur'));if(r){P=norm(r);return hub()}}catch(e){}home()})();
</script>
